<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ルーティン">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Daily Routine Dial</title>
</head>
<body>
<style>
  :root{
    --bg:#EEF0F3;
    --panel:#FFFFFF;
    --panel-2:#F6F7F9;
    --line:#DDE1E7;
    --line-soft:#E8EBEF;
    --text:#171B21;
    --text-2:#5B6472;
    --text-3:#8A93A1;
    --amber:#C77714;
    --indigo:#4E5BD6;
    --done:#2E8F68;
    --shadow:0 1px 2px rgba(16,19,24,.06), 0 12px 32px rgba(16,19,24,.07);
    --dial-face:#FFFFFF;
    --dial-track:#E3E7ED;
    --accent:var(--amber);
    --accent-soft:rgba(199,119,20,.12);
  }
  :root[data-period="night"]{ --accent:var(--indigo); --accent-soft:rgba(78,91,214,.12); }

  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0D1015;
      --panel:#161A21;
      --panel-2:#1B2028;
      --line:#262C36;
      --line-soft:#1F242D;
      --text:#E7EAEF;
      --text-2:#98A1B0;
      --text-3:#6B7482;
      --amber:#E9A03A;
      --indigo:#8B96FF;
      --done:#54BF92;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.35);
      --dial-face:#12161C;
      --dial-track:#252B35;
      --accent-soft:rgba(233,160,58,.14);
    }
    :root[data-period="night"]{ --accent-soft:rgba(139,150,255,.14); }
  }
  :root[data-theme="dark"]{
    --bg:#0D1015; --panel:#161A21; --panel-2:#1B2028; --line:#262C36; --line-soft:#1F242D;
    --text:#E7EAEF; --text-2:#98A1B0; --text-3:#6B7482;
    --amber:#E9A03A; --indigo:#8B96FF; --done:#54BF92;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.35);
    --dial-face:#12161C; --dial-track:#252B35; --accent-soft:rgba(233,160,58,.14);
  }
  :root[data-theme="dark"][data-period="night"]{ --accent-soft:rgba(139,150,255,.14); }
  :root[data-theme="light"]{
    --bg:#EEF0F3; --panel:#FFFFFF; --panel-2:#F6F7F9; --line:#DDE1E7; --line-soft:#E8EBEF;
    --text:#171B21; --text-2:#5B6472; --text-3:#8A93A1;
    --amber:#C77714; --indigo:#4E5BD6; --done:#2E8F68;
    --shadow:0 1px 2px rgba(16,19,24,.06), 0 12px 32px rgba(16,19,24,.07);
    --dial-face:#FFFFFF; --dial-track:#E3E7ED; --accent-soft:rgba(199,119,20,.12);
  }
  :root[data-theme="light"][data-period="night"]{ --accent-soft:rgba(78,91,214,.12); }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{
    font-family:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
  }
  .eyebrow{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-3);
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;}

  /* ---------- shell ---------- */
  .app{
    height:100dvh;
    display:grid;
    grid-template-columns:clamp(320px,36%,440px) 1fr;
    gap:18px;
    padding:18px;
    padding-top:max(18px,env(safe-area-inset-top));
    padding-bottom:max(18px,env(safe-area-inset-bottom));
  }
  .pane{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    min-height:0;
  }

  /* ---------- left: instrument ---------- */
  .instrument{
    display:flex; flex-direction:column; align-items:center;
    padding:22px 20px 18px;
    position:relative; overflow:hidden;
  }
  .instrument::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 70% at 50% -10%, var(--accent-soft), transparent 60%);
    transition:background .8s linear;
  }
  .inst-head{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:8px;z-index:1;}
  .greet{font-size:15px;font-weight:600;letter-spacing:.02em;}
  .dial{width:100%;max-width:330px;margin:6px 0 2px;z-index:1;}
  .dial svg{display:block;width:100%;height:auto;}
  .now{
    z-index:1;text-align:center;margin-top:-6px;
  }
  .now .time{font-size:clamp(34px,6.4vh,46px);font-weight:600;letter-spacing:-.02em;line-height:1.05;}
  .now .time .sec{font-size:.46em;color:var(--text-3);margin-left:.18em;letter-spacing:0;}
  .now .date{font-size:13px;color:var(--text-2);margin-top:2px;}

  .progress{z-index:1;width:100%;margin-top:16px;}
  .progress .p-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .progress .p-head .mono{font-size:13px;font-weight:600;color:var(--text-2);}
  .progress .track{height:7px;border-radius:4px;background:var(--dial-track);overflow:hidden;}
  .progress .track span{display:block;height:100%;width:0;border-radius:4px;background:var(--accent);transition:width .35s ease, background .3s;}
  .progress.full .track span{background:var(--done);}
  .progress.full .p-head .mono{color:var(--done);}

  .metrics{
    z-index:1;width:100%;margin-top:auto;padding-top:16px;
    display:grid;grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--line-soft);
  }
  .metric{padding:10px 4px;text-align:center;border-right:1px solid var(--line-soft);}
  .metric:last-child{border-right:none;}
  .metric .v{font-size:22px;font-weight:600;letter-spacing:-.01em;}
  .metric .v small{font-size:12px;font-weight:500;color:var(--text-3);margin-left:2px;}
  .metric .k{font-size:10.5px;letter-spacing:.1em;color:var(--text-3);margin-top:2px;}

  .week{z-index:1;width:100%;padding-top:12px;border-top:1px solid var(--line-soft);}
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px;}
  .day{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .bar{width:100%;height:44px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:5px;position:relative;overflow:hidden;}
  .bar span{position:absolute;left:0;right:0;bottom:0;background:var(--accent);opacity:.75;border-radius:0 0 4px 4px;transition:height .4s ease;}
  .day.full .bar span{opacity:1;background:var(--done);}
  .day.today .bar{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .day .lb{font-size:10px;color:var(--text-3);letter-spacing:.04em;}

  .lock{
    z-index:1;margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:9px;border:1px solid var(--line);border-radius:11px;font-size:12.5px;color:var(--text-2);
    transition:.2s;
  }
  .lock[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .lock .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);}
  .lock[aria-pressed="true"] .dot{background:var(--accent);}

  /* ---------- right: list ---------- */
  .board{display:flex;flex-direction:column;min-height:0;}
  .board-head{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:20px 24px 16px;border-bottom:1px solid var(--line-soft);
  }
  .board-head h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.01em;}
  .count{font-size:13px;color:var(--text-2);}
  .count b{color:var(--text);font-size:17px;font-weight:600;}
  .spacer{flex:1;}
  .tabs{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;}
  .tabs button{padding:6px 14px;border-radius:7px;font-size:13px;color:var(--text-2);transition:.15s;}
  .tabs button[aria-selected="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600;}
  .icon-btn{padding:7px 13px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--text-2);transition:.15s;}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);}

  .list{flex:1;overflow-y:auto;padding:6px 24px 28px;-webkit-overflow-scrolling:touch;}
  .sect{margin-top:18px;}
  .sect-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .sect-head .lbl{display:flex;align-items:baseline;gap:8px;}
  .sect-head .jp{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--text-2);}
  .sect-head .rule{flex:1;height:1px;background:var(--line-soft);}
  .sect-head .rate{font-size:11.5px;color:var(--text-3);}
  .sect.dim{opacity:.62;}

  .task{
    width:100%;display:flex;align-items:center;gap:14px;text-align:left;
    padding:14px 16px 14px 14px;margin-bottom:8px;
    background:var(--panel-2);border:1px solid var(--line-soft);border-left:3px solid transparent;
    border-radius:13px;transition:transform .12s ease, background .2s, border-color .2s, opacity .2s;
  }
  .task:active{transform:scale(.988);}
  .task .t-time{font-size:15px;font-weight:600;color:var(--text-2);width:52px;flex:none;}
  .task .t-icon{font-size:21px;width:26px;text-align:center;flex:none;}
  .task .t-body{flex:1;min-width:0;}
  .task .t-title{font-size:17px;font-weight:600;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .task .t-meta{font-size:12px;color:var(--text-3);margin-top:1px;}
  .task .t-check{
    width:30px;height:30px;flex:none;border-radius:50%;
    border:2px solid var(--line);position:relative;transition:.2s;
  }
  .task .t-check::after{
    content:"";position:absolute;left:9px;top:4.5px;width:6px;height:12px;
    border:solid #fff;border-width:0 2.4px 2.4px 0;transform:rotate(45deg) scale(.4);opacity:0;transition:.2s;
  }
  .task.next{border-left-color:var(--accent);background:var(--panel);border-color:var(--line);}
  .task.next .t-time{color:var(--accent);}
  .chip{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:9.5px;letter-spacing:.12em;
    padding:3px 7px;border-radius:5px;background:var(--accent);color:#fff;flex:none;
  }
  .task.done{opacity:.5;}
  .task.done .t-title{text-decoration:line-through;text-decoration-color:var(--text-3);text-decoration-thickness:1.5px;}
  .task.done .t-check{background:var(--done);border-color:var(--done);}
  .task.done .t-check::after{opacity:1;transform:rotate(45deg) scale(1);}

  .banner{
    margin:16px 0 4px;padding:14px 16px;border-radius:13px;
    background:var(--accent-soft);border:1px solid var(--accent);
    display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--accent);
  }
  .empty{padding:40px 0;text-align:center;color:var(--text-3);font-size:14px;}

  /* ---------- editor ---------- */
  .veil{position:fixed;inset:0;background:rgba(6,8,12,.5);backdrop-filter:blur(6px);display:none;z-index:50;align-items:center;justify-content:center;padding:20px;}
  .veil.open{display:flex;}
  .sheet{
    width:min(760px,100%);max-height:88dvh;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;
  }
  .sheet-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line-soft);}
  .sheet-head h2{margin:0;font-size:17px;font-weight:600;}
  .sheet-body{overflow-y:auto;padding:14px 22px 20px;}
  .erow{display:grid;grid-template-columns:104px 56px 1fr 74px 96px 40px;gap:8px;align-items:center;margin-bottom:8px;}
  .erow input,.erow select{
    width:100%;padding:9px 10px;font-size:14px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:9px;color:var(--text);
  }
  .erow input.t{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
  .erow .del{color:var(--text-3);font-size:18px;text-align:center;padding:6px;border-radius:8px;}
  .erow .del:hover{color:#D9534F;}
  .ehead{display:grid;grid-template-columns:104px 56px 1fr 74px 96px 40px;gap:8px;margin-bottom:8px;}
  .sheet-foot{display:flex;gap:10px;align-items:center;padding:14px 22px;border-top:1px solid var(--line-soft);}
  .btn{padding:10px 18px;border-radius:11px;border:1px solid var(--line);font-size:14px;transition:.15s;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .btn.ghost{color:var(--text-2);}
  .btn.danger{color:#D9534F;border-color:transparent;}

  @media (max-width:900px), (orientation:portrait){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto;height:auto;min-height:100dvh;}
    body{overflow:auto;}
    .instrument{flex-direction:row;flex-wrap:wrap;align-items:center;gap:18px;}
    .dial{max-width:190px;margin:0;}
    .inst-head{width:auto;flex:1;flex-direction:column;align-items:flex-start;}
    .now{text-align:left;margin:0;}
    .metrics,.week,.progress{margin-top:0;}
    .progress{flex-basis:100%;}
    .erow,.ehead{grid-template-columns:92px 1fr 68px 40px;}
    .erow select,.ehead span:nth-child(5){display:none;}
    .erow .ic{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;}
  }
  @keyframes doneglow{0%{box-shadow:0 0 0 0 var(--done);}100%{box-shadow:0 0 0 10px rgba(0,0,0,0);}}
  .progress.flash .track{animation:doneglow .9s ease-out;}
</style>

<div class="app">
  <!-- ============ instrument column ============ -->
  <aside class="pane instrument">
    <div class="inst-head">
      <div class="greet" id="greet">おはようございます</div>
      <button class="eyebrow" id="themeBtn" title="表示テーマを切り替え">THEME</button>
    </div>

    <div class="dial">
      <svg viewBox="0 0 240 240" role="img" aria-label="現在時刻">
        <circle cx="120" cy="120" r="112" fill="var(--dial-face)" stroke="var(--line)" stroke-width="1"/>
        <g id="ticks"></g>
        <g id="numerals"></g>
        <g id="hourHand"><rect x="117.4" y="56" width="5.2" height="69" rx="2.6" fill="var(--text)"/></g>
        <g id="minHand"><rect x="118.3" y="32" width="3.4" height="93" rx="1.7" fill="var(--text)"/></g>
        <g id="secHand"><rect x="119.2" y="26" width="1.6" height="108" rx="0.8" fill="var(--accent)"/></g>
        <circle cx="120" cy="120" r="5" fill="var(--text)"/>
        <circle cx="120" cy="120" r="2" fill="var(--dial-face)"/>
      </svg>
    </div>

    <div class="now">
      <div class="time mono"><span id="hhmm">--:--</span><span class="sec" id="ss">00</span></div>
      <div class="date" id="dateLine">—</div>
    </div>

    <div class="progress" id="progress">
      <div class="p-head"><span class="eyebrow">本日の進捗</span><span class="mono" id="pText">0 / 0</span></div>
      <div class="track"><span id="pFill"></span></div>
    </div>

    <div class="metrics">
      <div class="metric"><div class="v mono" id="mRate">0<small>%</small></div><div class="k eyebrow">本日</div></div>
      <div class="metric"><div class="v mono" id="mStreak">0<small>日</small></div><div class="k eyebrow">継続</div></div>
      <div class="metric"><div class="v mono" id="mWeek">0<small>%</small></div><div class="k eyebrow">7日平均</div></div>
    </div>

    <div class="week">
      <div class="eyebrow">過去7日</div>
      <div class="week-grid" id="weekGrid"></div>
    </div>

    <button class="lock" id="lockBtn" aria-pressed="false"><span class="dot"></span>画面を消さない</button>
  </aside>

  <!-- ============ board column ============ -->
  <main class="pane board">
    <div class="board-head">
      <h1>本日のルーティン</h1>
      <div class="count"><b id="cDone">0</b> / <span id="cAll">0</span></div>
      <div class="spacer"></div>
      <div class="tabs" id="tabs" role="tablist">
        <button role="tab" data-f="all" aria-selected="true">すべて</button>
        <button role="tab" data-f="morning" aria-selected="false">朝</button>
        <button role="tab" data-f="night" aria-selected="false">夜</button>
      </div>
      <button class="icon-btn" id="editBtn">編集</button>
    </div>
    <div class="list" id="list"></div>
  </main>
</div>

<!-- ============ editor ============ -->
<div class="veil" id="veil">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="ルーティンの編集">
    <div class="sheet-head">
      <h2>ルーティンの編集</h2>
      <div class="spacer" style="flex:1"></div>
      <button class="icon-btn" id="addBtn">＋ 追加</button>
    </div>
    <div class="sheet-body">
      <div class="ehead eyebrow"><span>TIME</span><span class="ic">ICON</span><span>TASK</span><span>MIN</span><span>WHEN</span><span></span></div>
      <div id="erows"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn danger" id="clearBtn">今日のチェックを消す</button>
      <div class="spacer" style="flex:1"></div>
      <button class="btn ghost" id="cancelBtn">キャンセル</button>
      <button class="btn primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY = "routine-dial-v1";

  var DEFAULTS = [
    {id:"m1", period:"morning", time:"06:00", title:"瞑想・家族への感謝", minutes:10, icon:"🧘"},
    {id:"m2", period:"morning", time:"06:15", title:"筋トレ",             minutes:20, icon:"💪"},
    {id:"m3", period:"morning", time:"06:40", title:"英会話の練習",       minutes:25, icon:"🗣️"},
    {id:"n1", period:"night",   time:"20:30", title:"英会話",             minutes:25, icon:"🗣️"},
    {id:"n2", period:"night",   time:"21:00", title:"シャドーイング",     minutes:20, icon:"🎧"},
    {id:"n3", period:"night",   time:"21:30", title:"ネットワークスペシャリストの勉強", minutes:45, icon:"📘"}
  ];

  var $ = function(s){ return document.querySelector(s); };
  var state, filter = "all", lastKey = "", wasComplete = false;

  /* ---------- storage ---------- */
  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY));
      if(s && Array.isArray(s.tasks) && s.tasks.length) return s;
    }catch(e){}
    return { tasks: JSON.parse(JSON.stringify(DEFAULTS)), log: {} };
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  /* ---------- date helpers ---------- */
  function keyOf(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function todayKey(){ return keyOf(new Date()); }
  function toMin(t){ var p = String(t).split(":"); return (+p[0]||0)*60 + (+p[1]||0); }
  function doneList(k){ return state.log[k] || []; }
  function sorted(){
    return state.tasks.slice().sort(function(a,b){ return toMin(a.time) - toMin(b.time); });
  }

  /* ---------- clock + dial ---------- */
  var ticks = "", nums = "";
  for(var i=0;i<60;i++){
    var major = i % 5 === 0;
    var a = i*6, len = major ? 10 : 5, w = major ? 2.2 : 1.2;
    ticks += '<rect x="'+(120-w/2)+'" y="'+(120-104)+'" width="'+w+'" height="'+len+'" rx="'+(w/2)+
             '" fill="var(--'+(major?'text-2':'text-3')+')" opacity="'+(major?1:.55)+'" transform="rotate('+a+' 120 120)"/>';
  }
  [[12,120,47],[3,203,126],[6,120,205],[9,37,126]].forEach(function(n){
    nums += '<text x="'+n[1]+'" y="'+n[2]+'" text-anchor="middle" font-size="16" font-weight="600" ' +
            'font-family="ui-monospace,SF Mono,Menlo,monospace" fill="var(--text-2)">'+n[0]+'</text>';
  });
  $("#ticks").innerHTML = ticks;
  $("#numerals").innerHTML = nums;

  function tick(){
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
    $("#hourHand").setAttribute("transform","rotate("+((h%12)*30 + m*0.5)+" 120 120)");
    $("#minHand").setAttribute("transform","rotate("+(m*6 + s*0.1)+" 120 120)");
    $("#secHand").setAttribute("transform","rotate("+(s*6)+" 120 120)");
    $("#hhmm").textContent = String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
    $("#ss").textContent = String(s).padStart(2,"0");

    var w = "日月火水木金土"[d.getDay()];
    $("#dateLine").textContent = d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日（" + w + "）";
    $("#greet").textContent = h < 4 ? "おつかれさまです" : h < 11 ? "おはようございます" : h < 17 ? "こんにちは" : "おかえりなさい";
    document.documentElement.setAttribute("data-period", (h >= 4 && h < 15) ? "morning" : "night");

    if(todayKey() !== lastKey){ lastKey = todayKey(); wasComplete = false; render(); }
  }

  /* ---------- stats ---------- */
  function rateOf(k){
    var n = state.tasks.length;
    if(!n) return 0;
    var done = doneList(k).filter(function(id){
      return state.tasks.some(function(t){ return t.id === id; });
    }).length;
    return Math.round(done / n * 100);
  }
  function streak(){
    var d = new Date(), n = 0;
    if(doneList(keyOf(d)).length === 0) d.setDate(d.getDate() - 1);
    for(var i=0;i<400;i++){
      if(doneList(keyOf(d)).length === 0) break;
      n++; d.setDate(d.getDate() - 1);
    }
    return n;
  }
  function renderStats(){
    var k = todayKey();
    var doneN = doneList(k).filter(function(id){ return state.tasks.some(function(t){ return t.id===id; }); }).length;
    $("#cDone").textContent = doneN;
    $("#cAll").textContent = state.tasks.length;
    $("#pText").textContent = doneN + " / " + state.tasks.length;
    $("#pFill").style.width = rateOf(k) + "%";
    $("#progress").classList.toggle("full", rateOf(k) >= 100 && state.tasks.length > 0);
    $("#mRate").innerHTML = rateOf(k) + "<small>%</small>";
    $("#mStreak").innerHTML = streak() + "<small>日</small>";

    var sum = 0, grid = "";
    for(var i=6;i>=0;i--){
      var d = new Date(); d.setDate(d.getDate() - i);
      var r = rateOf(keyOf(d)); sum += r;
      grid += '<div class="day' + (r>=100?" full":"") + (i===0?" today":"") + '">' +
              '<div class="bar"><span style="height:'+r+'%"></span></div>' +
              '<div class="lb">' + "日月火水木金土"[d.getDay()] + '</div></div>';
    }
    $("#weekGrid").innerHTML = grid;
    $("#mWeek").innerHTML = Math.round(sum/7) + "<small>%</small>";
  }

  /* ---------- list ---------- */
  function nextTaskId(){
    var now = new Date().getHours()*60 + new Date().getMinutes();
    var done = doneList(todayKey());
    var pend = sorted().filter(function(t){ return done.indexOf(t.id) < 0; });
    if(!pend.length) return null;
    var upcoming = pend.filter(function(t){ return toMin(t.time) + (t.minutes||0) >= now; });
    if(upcoming.length) return upcoming[0].id;
    // 予定時刻を過ぎている場合は、いま属している時間帯の未達を優先して促す
    var cur = (new Date().getHours() >= 4 && new Date().getHours() < 15) ? "morning" : "night";
    var inCur = pend.filter(function(t){ return t.period === cur; });
    return (inCur[0] || pend[0]).id;
  }

  function renderList(){
    var k = todayKey(), done = doneList(k), nid = nextTaskId(), html = "";
    var hour = new Date().getHours();
    var cur = (hour >= 4 && hour < 15) ? "morning" : "night";

    if(rateOf(k) >= 100 && state.tasks.length){
      html += '<div class="banner">✓ 本日のルーティン、すべて完了しました。</div>';
    }

    [["morning","朝","MORNING"],["night","夜","NIGHT"]].forEach(function(sec){
      if(filter !== "all" && filter !== sec[0]) return;
      var items = sorted().filter(function(t){ return t.period === sec[0]; });
      if(!items.length) return;
      var d = items.filter(function(t){ return done.indexOf(t.id) >= 0; }).length;
      var dim = (filter === "all" && sec[0] !== cur) ? " dim" : "";
      html += '<section class="sect'+dim+'"><div class="sect-head"><div class="lbl">' +
              '<span class="jp">'+sec[1]+'</span><span class="eyebrow">'+sec[2]+'</span></div>' +
              '<div class="rule"></div><div class="rate mono">'+d+'/'+items.length+'</div></div>';
      items.forEach(function(t){
        var isDone = done.indexOf(t.id) >= 0;
        html += '<button class="task' + (isDone?" done":"") + (t.id===nid?" next":"") + '" data-id="'+t.id+'" ' +
                'aria-pressed="'+isDone+'">' +
                '<span class="t-time mono">'+esc(t.time)+'</span>' +
                '<span class="t-icon">'+esc(t.icon||"•")+'</span>' +
                '<span class="t-body"><span class="t-title">'+esc(t.title)+'</span>' +
                '<span class="t-meta">'+(t.minutes?esc(t.minutes)+"分":"")+'</span></span>' +
                (t.id===nid ? '<span class="chip">NEXT</span>' : '') +
                '<span class="t-check"></span></button>';
      });
      html += '</section>';
    });

    if(!html) html = '<div class="empty">表示するタスクがありません。「編集」から追加してください。</div>';
    $("#list").innerHTML = html;
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];
    });
  }

  function render(){ renderList(); renderStats(); }

  /* ---------- interaction ---------- */
  var actx = null;
  function blip(up){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(up ? 660 : 380, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(up ? 990 : 300, actx.currentTime + .09);
      g.gain.setValueAtTime(.001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.14, actx.currentTime + .01);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .22);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + .24);
    }catch(e){}
  }

  $("#list").addEventListener("click", function(e){
    var btn = e.target.closest(".task");
    if(!btn) return;
    var id = btn.getAttribute("data-id"), k = todayKey();
    if(!state.log[k]) state.log[k] = [];
    var arr = state.log[k], i = arr.indexOf(id);
    if(i >= 0) arr.splice(i,1); else arr.push(id);
    save();
    blip(i < 0);
    render();
    if(rateOf(k) >= 100 && !wasComplete){
      wasComplete = true;
      var p = $("#progress");
      p.classList.remove("flash");
      void p.offsetWidth;
      p.classList.add("flash");
    }
    if(rateOf(k) < 100) wasComplete = false;
  });

  $("#tabs").addEventListener("click", function(e){
    var b = e.target.closest("button[data-f]");
    if(!b) return;
    filter = b.getAttribute("data-f");
    Array.prototype.forEach.call(this.querySelectorAll("button"), function(x){
      x.setAttribute("aria-selected", String(x === b));
    });
    renderList();
  });

  $("#themeBtn").addEventListener("click", function(){
    var r = document.documentElement;
    var dark = r.getAttribute("data-theme")
      ? r.getAttribute("data-theme") === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });

  /* screen wake lock */
  var wl = null;
  $("#lockBtn").addEventListener("click", function(){
    var btn = this;
    if(wl){ wl.release(); wl = null; btn.setAttribute("aria-pressed","false"); return; }
    if(!("wakeLock" in navigator)){ btn.textContent = "この端末では非対応"; return; }
    navigator.wakeLock.request("screen").then(function(s){
      wl = s; btn.setAttribute("aria-pressed","true");
      s.addEventListener("release", function(){ wl = null; btn.setAttribute("aria-pressed","false"); });
    }).catch(function(){ btn.setAttribute("aria-pressed","false"); });
  });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      render();
      if($("#lockBtn").getAttribute("aria-pressed") === "true" && !wl && "wakeLock" in navigator){
        navigator.wakeLock.request("screen").then(function(s){ wl = s; }).catch(function(){});
      }
    }
  });

  /* ---------- editor ---------- */
  var draft = [];
  function openEditor(){
    draft = sorted().map(function(t){ return Object.assign({}, t); });
    renderEditor();
    $("#veil").classList.add("open");
  }
  function renderEditor(){
    $("#erows").innerHTML = draft.map(function(t, i){
      return '<div class="erow" data-i="'+i+'">' +
        '<input class="t" type="time" value="'+esc(t.time)+'" data-f="time">' +
        '<input class="ic" type="text" value="'+esc(t.icon||"")+'" data-f="icon" maxlength="4">' +
        '<input type="text" value="'+esc(t.title)+'" data-f="title" placeholder="やること">' +
        '<input type="number" value="'+esc(t.minutes||0)+'" data-f="minutes" min="0" max="600">' +
        '<select data-f="period">' +
          '<option value="morning"'+(t.period==="morning"?" selected":"")+'>朝</option>' +
          '<option value="night"'+(t.period==="night"?" selected":"")+'>夜</option>' +
        '</select>' +
        '<button class="del" data-del="'+i+'" aria-label="削除">×</button></div>';
    }).join("");
  }
  $("#erows").addEventListener("click", function(e){
    var b = e.target.closest("[data-del]");
    if(!b) return;
    collect();
    draft.splice(+b.getAttribute("data-del"), 1);
    renderEditor();
  });
  function collect(){
    Array.prototype.forEach.call($("#erows").querySelectorAll(".erow"), function(row){
      var i = +row.getAttribute("data-i");
      Array.prototype.forEach.call(row.querySelectorAll("[data-f]"), function(el){
        var f = el.getAttribute("data-f");
        draft[i][f] = (f === "minutes") ? (parseInt(el.value,10) || 0) : el.value;
      });
    });
  }
  $("#addBtn").addEventListener("click", function(){
    collect();
    var h = new Date().getHours();
    draft.push({
      id: "t" + Date.now() + Math.floor(Math.random()*1000),
      period: (h >= 4 && h < 15) ? "morning" : "night",
      time: (h >= 4 && h < 15) ? "07:00" : "21:00",
      title: "", minutes: 15, icon: "✓"
    });
    renderEditor();
    var last = $("#erows").querySelector(".erow:last-child [data-f='title']");
    if(last) last.focus();
  });
  $("#saveBtn").addEventListener("click", function(){
    collect();
    state.tasks = draft.filter(function(t){ return t.title.trim() !== ""; });
    save();
    $("#veil").classList.remove("open");
    render();
  });
  $("#cancelBtn").addEventListener("click", function(){ $("#veil").classList.remove("open"); });
  $("#veil").addEventListener("click", function(e){ if(e.target === this) this.classList.remove("open"); });
  $("#editBtn").addEventListener("click", openEditor);
  $("#clearBtn").addEventListener("click", function(){
    state.log[todayKey()] = [];
    wasComplete = false;
    save(); render();
    $("#veil").classList.remove("open");
  });

  /* ---------- boot ---------- */
  if("serviceWorker" in navigator && location.protocol === "https:"){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
  state = load();
  lastKey = todayKey();
  wasComplete = rateOf(lastKey) >= 100;
  tick();
  render();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
